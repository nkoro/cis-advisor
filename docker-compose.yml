# Local-first deployment.
#
# The application routes all inference to the SiliconFlow API, so no local GPU
# or Ollama service is needed (the previous llm-engine stack was never called).
#
#   cp .env.example .env   # then set SILICONFLOW_API_KEY
#   docker compose up --build
#   open http://localhost:7860

services:
  advisor-app:
    build: .
    container_name: advising-ui
    ports:
      - "7860:7860"
    environment:
      # Compose interpolates these from the .env file beside this file.
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:?set SILICONFLOW_API_KEY in .env}
      - SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL:-https://api.siliconflow.com/v1}
      - SILICONFLOW_MODEL=${SILICONFLOW_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      - SILICONFLOW_INSECURE_TLS=${SILICONFLOW_INSECURE_TLS:-0}
      - ADVISOR_USERNAME=${ADVISOR_USERNAME:-}
      - ADVISOR_PASSWORD=${ADVISOR_PASSWORD:-}
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    volumes:
      # Keep the research telemetry CSV outside the container.
      - ./data:/app/data
    restart: unless-stopped
